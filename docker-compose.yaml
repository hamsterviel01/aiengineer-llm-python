services:
  # Ollama service for LLM and embedding models
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app_network

  # Model initialization service (runs once to pull models)
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama service..."
        sleep 5
        echo "Pulling smollm2:135m model..."
        ollama pull smollm2:135m
        echo "Pulling nomic-embed-text model..."
        ollama pull nomic-embed-text
        echo "Models successfully pulled!"
    networks:
      - app_network
    restart: "no"

  # Llama Guard safety classifier, served by a dedicated Ollama instance
  llama-guard:
    image: ollama/ollama:latest
    container_name: llama-guard
    ports:
      - "11435:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=-1  # keep the guard in memory so every request skips the model load
    volumes:
      - guard_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        pid=$$!
        trap 'kill $$pid' TERM INT
        until ollama list > /dev/null 2>&1; do sleep 1; done
        echo "Pulling llama-guard3:1b model..."
        ollama pull llama-guard3:1b
        echo "Warming up llama-guard3:1b..."
        ollama run llama-guard3:1b "hello" > /dev/null
        echo "Guard model ready!"
        wait $$pid
    healthcheck:
      test: ["CMD-SHELL", "ollama show llama-guard3:1b > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - app_network
    restart: unless-stopped

  # Phoenix observability platform
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: phoenix
    ports:
      - "6006:6006"  # Phoenix UI and OTLP HTTP
      - "4317:4317"  # OTLP gRPC
    environment:
      - PHOENIX_HOST=0.0.0.0
      - PHOENIX_PORT=6006
      - PHOENIX_ENABLE_AUTH=false
    volumes:
      - phoenix_data:/phoenix
    networks:
      - app_network
    restart: unless-stopped

  # Customer service application (optional - for testing)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: customer-service-app
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_MODEL=smollm2:135m
      - EMBEDDING_MODEL=nomic-embed-text
      - SAFETY_GUARD=${SAFETY_GUARD:-llama_guard}
      - GUARD_BASE_URL=http://llama-guard:11434
      - GUARD_MODEL=llama-guard3:1b
      - PHOENIX_ENDPOINT=http://phoenix:6006
      - PHOENIX_ENABLED=true
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      llama-guard:
        condition: service_healthy
      phoenix:
        condition: service_started
    networks:
      - app_network
    profiles:
      - full  # Only start with --profile full

volumes:
  ollama_data:
    driver: local
  guard_data:
    driver: local
  phoenix_data:
    driver: local

networks:
  app_network:
    driver: bridge

